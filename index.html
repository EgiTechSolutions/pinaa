<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maaf Biyy ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            position: relative;
            animation: fadeInUp 1s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .heart {
            font-size: 80px;
            color: #ff6b9d;
            margin-bottom: 20px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
        
        .name {
            font-family: 'Dancing Script', cursive;
            font-size: 48px;
            font-weight: 700;
            color: #ff6b9d;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .message {
            font-size: 18px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 300;
        }
        
        .sorry-text {
            font-family: 'Dancing Script', cursive;
            font-size: 36px;
            color: #e74c3c;
            margin: 20px 0;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        
        .promise {
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            display: inline-block;
            margin: 20px 0;
            box-shadow: 0 10px 20px rgba(255, 107, 157, 0.3);
            transition: all 0.3s ease;
        }
        
        .promise:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(255, 107, 157, 0.4);
        }
        
        .btn-forgive {
            background: linear-gradient(45deg, #ff6b9d, #ff8e8e);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255, 107, 157, 0.4);
            margin-top: 20px;
        }
        
        .btn-forgive:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(255, 107, 157, 0.6);
        }
        
        .floating-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }
        
        .heart-float {
            position: absolute;
            color: #ff6b9d;
            font-size: 20px;
            animation: float 6s infinite linear;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            color: #ffd700;
            font-size: 12px;
            animation: twinkle 2s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        
        @media (max-width: 480px) {
            .name { font-size: 36px; }
            h1 { font-size: 24px; }
            .sorry-text { font-size: 28px; }
            .message { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="hearts"></div>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div class="heart">💖</div>
        <div class="name">Biyy Sayangku</div>
        
        <h1>Maafkan Aku, Biyy... 😔</h1>
        
        <div class="sorry-text">MAAF YA BIYY 💕</div>
        
        <p class="message">
            akuu mintaa maaff biyy aku nggaa ada maksud mau diemin kamuu tadi itu aku lagi ngobrol sama guru aku biyy 
            <br>Maafin aku ya sayangku yang paling manis.
            <br>Aku janji akan lebih baik lagi untukmu. ❤️
        </p>
        
        <div class="promise">
            💝 Aku cinta kamu lebih dari apapun 💝
        </div>
        
        <button class="btn-forgive" onclick="forgive()">
            💕 Sudah Maafin Ya 💕
        </button>
    </div>

    <script>
        // Floating hearts animation
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-float';
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.animationDelay = Math.random() * 2 + 's';
            document.getElementById('hearts').appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 7000);
        }
        
        // Twinkling stars
        function createStar() {
            const star = document.createElement('div');
            star.className = 'star';
            star.innerHTML = '✨';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.animationDelay = Math.random() * 2 + 's';
            document.getElementById('stars').appendChild(star);
        }
        
        // Forgive button function
        function forgive() {
            const container = document.querySelector('.container');
            container.innerHTML = `
                <div style="font-size: 24px; color: #27ae60; animation: bounce 0.5s;">
                    <div style="font-size: 80px; margin-bottom: 20px;">🎉</div>
                    YAYYY! TERIMA KASIH BIYY! 💖💖💖
                    <br><br>
                    <div style="font-family: 'Dancing Script', cursive; font-size: 28px; color: #ff6b9d;">
                        Aku cinta kamu selamanya! 😍
                    </div>
                </div>
            `;
            
            // Create celebration hearts
            for(let i = 0; i < 20; i++) {
                setTimeout(createHeart, i * 200);
            }
        }
        
        // Initialize animations
        setInterval(createHeart, 800);
        for(let i = 0; i < 15; i++) {
            setTimeout(createStar, i * 300);
        }
        
        // Add click to create heart effect
        document.addEventListener('click', function(e) {
            const heart = document.createElement('div');
            heart.innerHTML = '💕';
            heart.style.position = 'fixed';
            heart.style.left = e.clientX + 'px';
            heart.style.top = e.clientY + 'px';
            heart.style.fontSize = '30px';
            heart.style.pointerEvents = 'none';
            heart.style.zIndex = '9999';
            heart.style.animation = 'float 3s forwards';
            document.body.appendChild(heart);
            
            setTimeout(() => heart.remove(), 3000);
        });
    </script>
</body>
</html>
