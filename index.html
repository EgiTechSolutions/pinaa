<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hallooo frend kuu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#ffd,#ffff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* BACKGROUND HEART */
.heart{
    position:fixed;
    color:rgba(255,255,255,0.2);
    animation:float 7s linear infinite;
    pointer-events:none;
}
@keyframes float{
    from{transform:translateY(100vh);}
    to{transform:translateY(-10vh);}
}

/* WRAPPER (CENTER FIX) */
.wrapper{
    width:100%;
    max-width:350px;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CARD */
.flip-card{
    width:100%;
    height:520px;
    perspective:1200px;
}

.flip-inner{
    width:100%;
    height:100%;
    transition:1.2s cubic-bezier(.4,2,.6,1);
    transform-style:preserve-3d;
    position:relative;
}

.flip-card.flipped .flip-inner{
    transform:rotateY(180deg);
}

/* CARD BASE */
.card{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:25px;
    padding:30px;
    text-align:center;
    backface-visibility:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
}

/* FRONT */
.front{
    background:rgba(255,255,255,0.95);
}

.front i{
    font-size:70px;
    color:#ff1;
    margin-bottom:15px;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

.front h1{
    color:#ff1493;
}

.tap{
    object-fit:cover;
    margin-top:10px;
    color:#ff69b4;
    font-size:14px;
}

/* BACK */
.back{
    background:linear-gradient(135deg,#ff69b4,#ff1493);
    color:white;
    transform:rotateY(180deg);
}

/* PHOTO */
.photo{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    box-shadow:0 0 25px rgba(255,255,255,0.8);
    margin-bottom:15px;
}

/* TEXT */
#typing{
    font-size:14px;
    line-height:1.6;
    min-height:70px;
    margin:10px 0;
}

/* BUTTON */
.btn{
    padding:10px 18px;
    border:none;
    border-radius:20px;
    margin:5px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.btn-love{
    background:white;
    color:#ff3628;
}

.btn-party{
    background:#ffc;
}

.btn:hover{
    transform:scale(1.1);
}

/* MUSIC BTN */
.music-btn{
    position:fixed;
    top:20px;
    right:20px;
    background:white;
    padding:12px;
    border-radius:50%;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
    cursor:pointer;
}

.love-wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
}

/* ICON LOVE */
.love-icon{
    font-size:60px;
    color:#ffff;
    text-shadow:0 0 20px black;
}

/* FOTO */
.love-photo{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid white;
    box-shadow:0 0 20px white;
}

/* TEXT */
.love-text{
    color:white;
    font-weight:600;
    font-size:14px;
    text-shadow:0 0 10px black;
}

/* ANIMASI */
@keyframes lovePop{
    0%{
        transform:translate(-50%,-50%) scale(0);
        opacity:0;
    }
    40%{
        transform:translate(-50%,-50%) scale(1.2);
        opacity:1;
    }
    100%{
        transform:translate(-50%,-50%) scale(1);
        opacity:0;
    }
}
</style>
</head>

<body>

<audio id="music" loop>
<source src="https://files.catbox.moe/4t7ds5.mp3">
</audio>

<div class="music-btn" onclick="toggleMusic()">
<i id="musicIcon" class="fas fa-volume-up"></i>
</div>

<div class="wrapper">
<div class="flip-card" id="card">
<div class="flip-inner">

<!-- FRONT -->
<div class="card front">
<i class="fas fa-cake-candles"></i>
<h1>halooo frend kuu</h1>
<p>Untuk kamu </p>
<p class="tap">Tap untuk buka</p>
</div>

<!-- BACK -->
<div class="card back">

<img src="https://files.catbox.moe/lrx01v.jpg" class="photo">

<h2>frendd akuu</h2>
<p id="typing"></p>

<div>
<button class="btn btn-love" onclick="love(event)">
<i class="fas fa-heart"></i>
</button>
</button>
</div>

</div>

</div>
</div>
</div>

<script>
const card=document.getElementById("card");
const music=document.getElementById("music");

let started=false;

card.onclick=()=>{
    card.classList.toggle("flipped");
    music.play().catch(()=>{});

    if(!started){
        typing();
        started=true;
    }
};

let text="halloo acaaa imutt inii khusus untuk kamuu yaa";
let i=0;

function typing(){
    if(i<text.length){
        document.getElementById("typing").innerHTML+=text.charAt(i);
        i++;
        setTimeout(typing,40);
    }
}

function love(e){
    e.stopPropagation();

    let box = document.createElement("div");

    box.innerHTML = `
        <div class="love-wrapper">
            <i class="fas fa-heart love-icon"></i>
            <img src="https://files.catbox.moe/d6mm0a.jpg" class="love-photo">
            <p class="love-text">cantikk dehh</p>
        </div>
    `;

    box.style.position = "fixed";
    box.style.left = "50%";
    box.style.top = "50%";
    box.style.transform = "translate(-50%, -50%) scale(0)";
    box.style.zIndex = "9999";
    box.style.animation = "lovePop 1.5s ease forwards";

    document.body.appendChild(box);

    setTimeout(()=>box.remove(),1800);
}

function toggleMusic(){
    if(music.paused){
        music.play();
        musicIcon.className="fas fa-volume-up";
    }else{
        music.pause();
        musicIcon.className="fas fa-volume-mute";
    }
}

/* BG HEART */
setInterval(()=>{
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML='<i class="fas fa-heart"></i>';
    h.style.left=Math.random()*100+"%";
    h.style.fontSize=Math.random()*20+10+"px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),7000);
},800);
</script>

</body>
</html>
