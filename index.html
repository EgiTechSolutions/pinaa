<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Media Vault — Galeri Foto & Video</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0b;
      --surface: #111114;
      --card: #16161a;
      --border: #2a2a30;
      --accent: #e8ff47;
      --accent2: #ff6b35;
      --text: #f0f0f0;
      --muted: #666672;
      --photo-tag: #47b8ff;
      --video-tag: #ff6b35;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ─── NOISE OVERLAY ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    /* ─── HEADER ─── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10,10,11,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 3px;
      color: var(--accent);
      line-height: 1;
      flex-shrink: 0;
    }
    .logo span { color: var(--muted); font-size: 14px; display: block; letter-spacing: 6px; font-family: 'DM Sans', sans-serif; font-weight: 300; margin-top: -2px; }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      justify-content: flex-end;
    }

    .search-wrap {
      position: relative;
      flex: 1;
      max-width: 320px;
    }
    .search-wrap input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 9px 16px 9px 38px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap input::placeholder { color: var(--muted); }
    .search-wrap .ico {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 18px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--accent);
      color: #0a0a0b;
    }
    .btn-primary:hover { background: #d4e83f; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(232,255,71,0.25); }
    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* ─── MAIN ─── */
    main { padding: 32px 40px 80px; }

    /* ─── STATS BAR ─── */
    .stats-bar {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .stat {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .stat-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      line-height: 1;
      color: var(--accent);
    }
    .stat-label { font-size: 13px; color: var(--muted); }
    .stat-divider { width: 1px; height: 28px; background: var(--border); }

    /* ─── FILTER TABS ─── */
    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--muted); }
    .filter-btn.active { background: var(--accent); color: #0a0a0b; border-color: var(--accent); }

    /* ─── LAYOUT TOGGLE ─── */
    .view-toggle {
      display: flex;
      gap: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      margin-left: auto;
    }
    .view-btn {
      padding: 5px 10px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .view-btn.active { background: var(--accent); color: #0a0a0b; }

    /* ─── ALBUMS SECTION ─── */
    .section-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .albums-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 36px;
      scrollbar-width: none;
    }
    .albums-row::-webkit-scrollbar { display: none; }

    .album-card {
      flex-shrink: 0;
      width: 140px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .album-card:hover { transform: translateY(-4px); }
    .album-thumb {
      width: 140px;
      height: 100px;
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
      position: relative;
      margin-bottom: 8px;
      background: var(--card);
    }
    .album-thumb-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      width: 100%;
      height: 100%;
      gap: 2px;
    }
    .album-thumb-cell {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .album-name { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .album-count { font-size: 11px; color: var(--muted); }
    .album-new-btn {
      flex-shrink: 0;
      width: 140px;
      height: 100px;
      border-radius: 10px;
      border: 2px dashed var(--border);
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    .album-new-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ─── GRID ─── */
    #media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px;
    }
    #media-grid.list-view {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .media-item {
      border-radius: 12px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s;
      position: relative;
      animation: fadeUp 0.4s ease both;
    }
    .media-item:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 16px 40px rgba(0,0,0,0.5); border-color: var(--accent); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .media-item .thumb {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
    }
    .media-item .thumb-video {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    .media-item .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(10,10,11,0.7);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      transition: all 0.2s;
      opacity: 0;
      backdrop-filter: blur(8px);
    }
    .media-item:hover .play-btn { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    .media-info {
      padding: 12px 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .media-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .media-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .tag {
      font-size: 10px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 100px;
      flex-shrink: 0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .tag-photo { background: rgba(71,184,255,0.15); color: var(--photo-tag); }
    .tag-video { background: rgba(255,107,53,0.15); color: var(--video-tag); }

    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(10,10,11,0.6);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      opacity: 0;
      backdrop-filter: blur(6px);
      color: white;
    }
    .media-item:hover .fav-btn { opacity: 1; }
    .fav-btn.active { opacity: 1; color: #ff4d6d; }
    .fav-btn:hover { transform: scale(1.15); }

    /* ─── LIST VIEW ─── */
    #media-grid.list-view .media-item { display: flex; align-items: center; gap: 0; }
    #media-grid.list-view .thumb,
    #media-grid.list-view .thumb-video {
      width: 80px;
      height: 56px;
      aspect-ratio: unset;
      flex-shrink: 0;
      border-radius: 0;
    }
    #media-grid.list-view .play-btn { display: none; }
    #media-grid.list-view .fav-btn { opacity: 1; top: 50%; transform: translateY(-50%); right: 14px; }
    #media-grid.list-view .media-info { flex: 1; padding: 10px 14px; }

    /* ─── LIGHTBOX ─── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(5,5,7,0.95);
      backdrop-filter: blur(20px);
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.25s ease;
    }
    .lightbox.open { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .lightbox-inner {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      animation: zoomIn 0.25s ease;
    }
    @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .lightbox-inner img,
    .lightbox-inner video {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 12px;
      display: block;
      object-fit: contain;
    }

    .lb-close {
      position: fixed;
      top: 24px;
      right: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 20px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 1001;
    }
    .lb-close:hover { background: var(--accent); color: #0a0a0b; border-color: var(--accent); }

    .lb-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(22,22,26,0.8);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 22px;
      width: 44px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
    }
    .lb-nav:hover { background: var(--accent); color: #0a0a0b; border-color: var(--accent); }
    .lb-prev { left: 20px; }
    .lb-next { right: 20px; }

    .lb-caption {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22,22,26,0.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 13px;
      color: var(--text);
      text-align: center;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    /* ─── UPLOAD ZONE ─── */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      margin-bottom: 36px;
      transition: all 0.25s;
      cursor: pointer;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(232,255,71,0.03);
    }
    .drop-zone input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .drop-icon { font-size: 36px; margin-bottom: 10px; }
    .drop-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; color: var(--text); margin-bottom: 6px; }
    .drop-sub { font-size: 13px; color: var(--muted); }
    .drop-formats { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    .drop-fmt {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 100px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 500;
    }

    /* ─── EMPTY ─── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      display: none;
    }
    .empty-state.show { display: block; }
    .empty-state .big { font-family: 'Bebas Neue', sans-serif; font-size: 48px; color: var(--border); letter-spacing: 4px; }
    .empty-state p { font-size: 14px; color: var(--muted); margin-top: 8px; }

    /* ─── SCROLLBAR ─── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    @media (max-width: 640px) {
      header { padding: 14px 20px; }
      main { padding: 24px 16px 60px; }
      .logo span { display: none; }
      #media-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    VAULT
    <span>MEDIA GALLERY</span>
  </div>
  <div class="header-controls">
    <div class="search-wrap">
      <span class="ico">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </span>
      <input type="text" id="searchInput" placeholder="Cari file...">
    </div>
    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      Tambah
    </button>
  </div>
</header>

<!-- MAIN -->
<main>

  <!-- UPLOAD ZONE -->
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" multiple accept="image/*,video/*" onchange="handleFiles(this.files)">
    <div class="drop-icon">📁</div>
    <div class="drop-title">Seret & Lepas File di Sini</div>
    <div class="drop-sub">atau klik untuk memilih dari perangkat Anda</div>
    <div class="drop-formats">
      <span class="drop-fmt">JPG</span>
      <span class="drop-fmt">PNG</span>
      <span class="drop-fmt">GIF</span>
      <span class="drop-fmt">WEBP</span>
      <span class="drop-fmt">MP4</span>
      <span class="drop-fmt">WEBM</span>
      <span class="drop-fmt">MOV</span>
      <span class="drop-fmt">AVI</span>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-bar" id="statsBar">
    <div class="stat"><span class="stat-num" id="totalCount">0</span><span class="stat-label">total file</span></div>
    <div class="stat-divider"></div>
    <div class="stat"><span class="stat-num" id="photoCount">0</span><span class="stat-label">foto</span></div>
    <div class="stat-divider"></div>
    <div class="stat"><span class="stat-num" id="videoCount">0</span><span class="stat-label">video</span></div>
    <div class="stat-divider"></div>
    <div class="stat"><span class="stat-num" id="favCount">0</span><span class="stat-label">favorit</span></div>
  </div>

  <!-- ALBUMS -->
  <div class="section-title">ALBUM</div>
  <div class="albums-row" id="albumsRow">
    <button class="album-new-btn" onclick="alert('Fitur album segera hadir!')">
      <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Album Baru
    </button>
  </div>

  <!-- FILTER + VIEW TOGGLE -->
  <div class="filter-row">
    <button class="filter-btn active" onclick="filterMedia('all', this)">Semua</button>
    <button class="filter-btn" onclick="filterMedia('photo', this)">🖼 Foto</button>
    <button class="filter-btn" onclick="filterMedia('video', this)">🎬 Video</button>
    <button class="filter-btn" onclick="filterMedia('fav', this)">❤️ Favorit</button>
    <div class="view-toggle">
      <button class="view-btn active" id="gridViewBtn" onclick="setView('grid')" title="Grid">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <button class="view-btn" id="listViewBtn" onclick="setView('list')" title="List">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- GRID -->
  <div id="media-grid"></div>

  <!-- EMPTY STATE -->
  <div class="empty-state" id="emptyState">
    <div class="big">KOSONG</div>
    <p>Belum ada media yang ditampilkan.<br>Unggah foto atau video untuk memulai.</p>
  </div>

</main>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <button class="lb-nav lb-prev" onclick="navLightbox(-1)">‹</button>
  <div class="lightbox-inner" id="lbContent"></div>
  <button class="lb-nav lb-next" onclick="navLightbox(1)">›</button>
  <div class="lb-caption" id="lbCaption"></div>
</div>

<script>
  let mediaItems = [];
  let currentFilter = 'all';
  let currentView = 'grid';
  let lbIndex = 0;

  const grid = document.getElementById('media-grid');
  const emptyState = document.getElementById('emptyState');

  // ─── DRAG & DROP ───
  const dz = document.getElementById('dropZone');
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () =>
